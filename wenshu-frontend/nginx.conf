# 文枢前端站点配置。
# 后端地址为 compose 服务名 wenshu-backend:8000;若你的后端服务名/端口不同,改下面 $backend。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker 内嵌 DNS。配合「变量式 proxy_pass」让后端主机名在请求时才解析,
    # 这样后端暂时不可达/重启时,nginx 仍能正常启动,不会因解析失败而崩。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── API 反代 ────────────────────────────────────────────────────────
    # 正则镜像 vite.config.ts 的 dev proxy,只代理这些前缀。
    # 关键:alternation 里的 dataset 后接 (/|$),不会匹配 SPA 路由 /datasets(列表页),
    #       同时 datasources 作为独立分支正常命中。
    location ~ ^/(agent|auth|chart|dataset|datasources|conversations|healthz|readyz)(/|$) {
        set $backend http://wenshu-backend:8000;
        proxy_pass $backend$request_uri;        # 变量式 → 延迟解析;$request_uri 透传原始路径+查询串

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式(问数、数据集问答):关缓冲、禁缓存、长超时,事件即时下发
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # 数据集上传大文件
        client_max_body_size 100m;
    }

    # 带 hash 的静态资源,长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback:其余路径一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
