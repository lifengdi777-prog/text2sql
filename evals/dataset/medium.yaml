# Medium: JOIN + 复合比率指标(达成率/合格率/不良率/生产效率) + 排序 / TopN / 时间筛选
# 比率指标公式(对齐 conf/meta_config.json):
#   产量达成率 = SUM(actual_quantity)/SUM(planned_quantity)
#   合格率     = SUM(qualified_quantity)/SUM(actual_quantity)
#   不良率     = SUM(defect_quantity)/SUM(actual_quantity)
#   生产效率   = SUM(actual_quantity)/SUM(production_hours)
# ⚠ 按工厂/地区/城市聚合需 记录→车间→工厂 两跳;车间须按 workshop_id 分组(车间名不唯一)。

- id: medium_001
  difficulty: medium
  category: groupby_orderby
  query: "各工厂的实际产量是多少？按产量从高到低排序"
  gold_sql: |
    SELECT f.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_factory f ON w.factory_id = f.factory_id
    GROUP BY f.factory_name
    ORDER BY actual_quantity DESC
  gold_tables: [table_production_record, table_workshop, table_factory]
  gold_columns: [factory_name, actual_quantity]

- id: medium_002
  difficulty: medium
  category: topn
  query: "实际产量最高的前三个产品是哪些？"
  gold_sql: |
    SELECT pd.product_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_name
    ORDER BY actual_quantity DESC
    LIMIT 3
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_name, actual_quantity]

- id: medium_003
  difficulty: medium
  category: ratio_metric
  query: "各产品类别的产量达成率是多少？"
  gold_sql: |
    SELECT pd.product_category,
           SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_category
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_category, actual_quantity, planned_quantity]

- id: medium_004
  difficulty: medium
  category: ratio_metric_snowflake
  query: "统计各工厂的合格率"
  gold_sql: |
    SELECT f.factory_name,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_factory f ON w.factory_id = f.factory_id
    GROUP BY f.factory_name
  gold_tables: [table_production_record, table_workshop, table_factory]
  gold_columns: [factory_name, qualified_quantity, actual_quantity]

- id: medium_005
  difficulty: medium
  category: ratio_metric_orderby
  query: "各车间产线的不良率是多少？从高到低排列"
  gold_sql: |
    SELECT w.workshop_name, w.line_name,
           SUM(p.defect_quantity) / SUM(p.actual_quantity) AS defect_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.workshop_id, w.workshop_name, w.line_name
    ORDER BY defect_rate DESC
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [workshop_name, line_name, defect_quantity, actual_quantity]

- id: medium_006
  difficulty: medium
  category: time_filter_snowflake
  query: "统计 2026 年各工厂的实际产量"
  gold_sql: |
    SELECT f.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_factory f ON w.factory_id = f.factory_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026
    GROUP BY f.factory_name
  gold_tables: [table_production_record, table_workshop, table_factory, table_date]
  gold_columns: [factory_name, actual_quantity, year]

- id: medium_007
  difficulty: medium
  category: time_trend
  query: "2026 年每个月的实际产量是多少？"
  gold_sql: |
    SELECT d.month, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026
    GROUP BY d.month
    ORDER BY d.month
  gold_tables: [table_production_record, table_date]
  gold_columns: [month, actual_quantity]

- id: medium_008
  difficulty: medium
  category: ratio_metric
  query: "各工序的合格率分别是多少？"
  gold_sql: |
    SELECT pr.process_name,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_process pr ON p.process_id = pr.process_id
    GROUP BY pr.process_name
  gold_tables: [table_production_record, table_process]
  gold_columns: [process_name, qualified_quantity, actual_quantity]

- id: medium_009
  difficulty: medium
  category: groupby_by_type
  query: "各设备类型的实际产量是多少？"
  gold_sql: |
    SELECT e.equipment_type, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_equipment e ON p.equipment_id = e.equipment_id
    GROUP BY e.equipment_type
  gold_tables: [table_production_record, table_equipment]
  gold_columns: [equipment_type, actual_quantity]

- id: medium_010
  difficulty: medium
  category: topn
  query: "停机时长最长的前五台设备是哪些？"
  gold_sql: |
    SELECT e.equipment_name, SUM(p.downtime_minutes) AS downtime_minutes
    FROM table_production_record p
    JOIN table_equipment e ON p.equipment_id = e.equipment_id
    GROUP BY e.equipment_name
    ORDER BY downtime_minutes DESC
    LIMIT 5
  gold_tables: [table_production_record, table_equipment]
  gold_columns: [equipment_name, downtime_minutes]

- id: medium_011
  difficulty: medium
  category: avg_metric
  query: "各产品类别的平均生产工时是多少？"
  gold_sql: |
    SELECT pd.product_category, AVG(p.production_hours) AS avg_production_hours
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_category
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_category, production_hours]

- id: medium_012
  difficulty: medium
  category: ratio_metric_orderby_snowflake
  query: "各工厂的产量达成率，按从高到低排序"
  gold_sql: |
    SELECT f.factory_name,
           SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_factory f ON w.factory_id = f.factory_id
    GROUP BY f.factory_name
    ORDER BY achievement_rate DESC
  gold_tables: [table_production_record, table_workshop, table_factory]
  gold_columns: [factory_name, actual_quantity, planned_quantity]

- id: medium_013
  difficulty: medium
  category: snowflake_region   # 雪花两跳的"地区"汇总,专门测多跳连接
  query: "各地区的总实际产量是多少？"
  gold_sql: |
    SELECT f.region, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_factory f ON w.factory_id = f.factory_id
    GROUP BY f.region
  gold_tables: [table_production_record, table_workshop, table_factory]
  gold_columns: [region, actual_quantity]
