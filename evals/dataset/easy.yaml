# Easy: 单表查询 / 单 JOIN + 基础聚合,主体与指标明确
# 数据来源: test/dw.sql(制造业生产记录,2025-2026 全年周粒度)
# 维表: table_product / table_workshop / table_equipment / table_process / table_date
# 事实表: table_production_record(度量: planned/actual/qualified/defect_quantity, downtime_minutes, production_hours)

# ── 纯维表查询(单表,无 JOIN)──────────────────────────────
- id: easy_001
  difficulty: easy
  category: dim_count
  query: "每种设备状态下各有多少台设备？"
  gold_sql: |
    SELECT equipment_status, COUNT(*) AS equipment_count
    FROM table_equipment
    GROUP BY equipment_status
  gold_tables: [table_equipment]
  gold_columns: [equipment_status]

- id: easy_002
  difficulty: easy
  category: dim_count
  query: "每个产品类别下有多少个产品？"
  gold_sql: |
    SELECT product_category, COUNT(*) AS product_count
    FROM table_product
    GROUP BY product_category
  gold_tables: [table_product]
  gold_columns: [product_category]

- id: easy_003
  difficulty: easy
  category: dim_list
  query: "列出所有工厂名称"
  gold_sql: |
    SELECT DISTINCT factory_name
    FROM table_workshop
  gold_tables: [table_workshop]
  gold_columns: [factory_name]

# ── 单指标合计(事实表单表,无 JOIN)────────────────────────
- id: easy_004
  difficulty: easy
  category: single_metric_total
  query: "所有生产记录的实际产量总和是多少？"
  gold_sql: |
    SELECT SUM(actual_quantity) AS actual_quantity
    FROM table_production_record
  gold_tables: [table_production_record]
  gold_columns: [actual_quantity]

- id: easy_005
  difficulty: easy
  category: single_metric_total
  query: "总停机时长是多少分钟？"
  gold_sql: |
    SELECT SUM(downtime_minutes) AS downtime_minutes
    FROM table_production_record
  gold_tables: [table_production_record]
  gold_columns: [downtime_minutes]

- id: easy_006
  difficulty: easy
  category: single_metric_total
  query: "一共有多少不良品数量？"
  gold_sql: |
    SELECT SUM(defect_quantity) AS defect_quantity
    FROM table_production_record
  gold_tables: [table_production_record]
  gold_columns: [defect_quantity]

# ── 单指标 + 单 JOIN + GROUP BY ──────────────────────────
- id: easy_007
  difficulty: easy
  category: single_metric_groupby
  query: "统计各工厂的实际产量"
  gold_sql: |
    SELECT w.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity]

- id: easy_008
  difficulty: easy
  category: single_metric_groupby
  query: "统计各车间的实际产量"
  gold_sql: |
    SELECT w.workshop_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.workshop_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [workshop_name, actual_quantity]

- id: easy_009
  difficulty: easy
  category: single_metric_groupby
  query: "各产品类别的实际产量分别是多少？"
  gold_sql: |
    SELECT pd.product_category, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_category
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_category, actual_quantity]

- id: easy_010
  difficulty: easy
  category: single_metric_groupby
  query: "统计各工厂的计划产量"
  gold_sql: |
    SELECT w.factory_name, SUM(p.planned_quantity) AS planned_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, planned_quantity]

- id: easy_011
  difficulty: easy
  category: single_metric_groupby
  query: "各工序的总停机时长是多少？"
  gold_sql: |
    SELECT pr.process_name, SUM(p.downtime_minutes) AS downtime_minutes
    FROM table_production_record p
    JOIN table_process pr ON p.process_id = pr.process_id
    GROUP BY pr.process_name
  gold_tables: [table_production_record, table_process]
  gold_columns: [process_name, downtime_minutes]

- id: easy_012
  difficulty: easy
  category: single_metric_groupby
  query: "统计各产品的实际产量"
  gold_sql: |
    SELECT pd.product_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_name
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_name, actual_quantity]
