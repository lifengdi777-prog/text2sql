# Extra: 业务同义词、反向语义、隐含术语、相对时间表达
# 专门测召回链路对"用户口语化术语"的鲁棒性 + 时间推断(当前为 2026 年)
# 同义词映射:良率/良品率=合格率, 次品率/报废率=不良率, 目标产量=计划产量, 单位工时产量=生产效率

- id: extra_001
  difficulty: extra
  category: synonym_qualified_rate
  query: "各产品类别的良品率怎么样？"   # 良品率 = 合格率
  gold_sql: |
    SELECT pd.product_category,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_category
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_category, qualified_quantity, actual_quantity]

- id: extra_002
  difficulty: extra
  category: reverse_semantic_min
  query: "哪个工厂的产量最低？"
  gold_sql: |
    SELECT w.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
    ORDER BY actual_quantity ASC
    LIMIT 1
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity]

- id: extra_003
  difficulty: extra
  category: synonym_defect_rate_topn
  query: "次品率最高的产品是哪个？"   # 次品率 = 不良率
  gold_sql: |
    SELECT pd.product_name,
           SUM(p.defect_quantity) / SUM(p.actual_quantity) AS defect_rate
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_name
    ORDER BY defect_rate DESC
    LIMIT 1
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_name, defect_quantity, actual_quantity]

- id: extra_004
  difficulty: extra
  category: relative_time_this_year
  query: "今年各工厂的实际产量是多少？"   # 今年 = 2026
  gold_sql: |
    SELECT w.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [factory_name, actual_quantity, year]

- id: extra_005
  difficulty: extra
  category: implicit_time_first_half
  query: "2026 年上半年各车间的实际产量"   # 上半年 = 1~6 月
  gold_sql: |
    SELECT w.workshop_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026 AND d.month <= 6
    GROUP BY w.workshop_name
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [workshop_name, actual_quantity, year, month]

- id: extra_006
  difficulty: extra
  category: synonym_efficiency
  query: "各工厂的单位工时产量是多少？"   # 单位工时产量 = 生产效率
  gold_sql: |
    SELECT w.factory_name,
           SUM(p.actual_quantity) / SUM(p.production_hours) AS efficiency
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity, production_hours]

- id: extra_007
  difficulty: extra
  category: synonym_target_quantity
  query: "各工厂的目标产量完成得如何？"   # 目标产量=计划产量, 完成情况=达成率
  gold_sql: |
    SELECT w.factory_name,
           SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity, planned_quantity]

- id: extra_008
  difficulty: extra
  category: reverse_semantic_worst
  query: "停机时间最长的设备是哪台？"
  gold_sql: |
    SELECT e.equipment_name, SUM(p.downtime_minutes) AS downtime_minutes
    FROM table_production_record p
    JOIN table_equipment e ON p.equipment_id = e.equipment_id
    GROUP BY e.equipment_name
    ORDER BY downtime_minutes DESC
    LIMIT 1
  gold_tables: [table_production_record, table_equipment]
  gold_columns: [equipment_name, downtime_minutes]

- id: extra_009
  difficulty: extra
  category: implicit_below_target
  query: "有哪些工厂没有完成生产计划？"   # 没完成 = 达成率 < 100%
  gold_sql: |
    SELECT w.factory_name,
           SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
    HAVING SUM(p.actual_quantity) / SUM(p.planned_quantity) < 1
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity, planned_quantity]

- id: extra_010
  difficulty: extra
  category: synonym_total_output_topn
  query: "产出最多的车间是哪个？"   # 产出 = 实际产量
  gold_sql: |
    SELECT w.workshop_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.workshop_name
    ORDER BY actual_quantity DESC
    LIMIT 1
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [workshop_name, actual_quantity]
