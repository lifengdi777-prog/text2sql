# Extra Hard: 业务同义词、反向语义、隐含术语
# 这一档专门测召回链路对"用户口语化术语"的鲁棒性

- id: extra_001
  difficulty: extra
  category: synonym_quality
  query: "统计各工序的良率"
  # "良率" 是 合格率 的口语化表达,见数据库介绍.md 同义词
  gold_sql: |
    SELECT pr.process_name,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_process pr ON p.process_id = pr.process_id
    GROUP BY pr.process_name
  gold_tables: [table_production_record, table_process]
  gold_columns: [process_name, qualified_quantity, actual_quantity]

- id: extra_002
  difficulty: extra
  category: synonym_downtime
  query: "统计各设备的宕机时间排名"
  # "宕机时间" = 停机时长
  gold_sql: |
    SELECT e.equipment_name, SUM(p.downtime_minutes) AS downtime_minutes
    FROM table_production_record p
    JOIN table_equipment e ON p.equipment_id = e.equipment_id
    GROUP BY e.equipment_name
    ORDER BY downtime_minutes DESC
  gold_tables: [table_production_record, table_equipment]
  gold_columns: [equipment_name, downtime_minutes]

- id: extra_003
  difficulty: extra
  category: synonym_efficiency
  query: "统计各产线的产线效率排行"
  # "产线效率" = 生产效率
  gold_sql: |
    SELECT w.line_name,
           SUM(p.actual_quantity) / SUM(p.production_hours) AS efficiency
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.line_name
    ORDER BY efficiency DESC
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [line_name, actual_quantity, production_hours]

- id: extra_004
  difficulty: extra
  category: synonym_achievement
  query: "统计各工厂的计划完成率"
  # "计划完成率" = 产量达成率
  gold_sql: |
    SELECT w.factory_name,
           SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity, planned_quantity]

- id: extra_005
  difficulty: extra
  category: reverse_order
  query: "找出生产效率最低的三条产线"
  # 反向 ORDER BY ASC
  gold_sql: |
    SELECT w.line_name,
           SUM(p.actual_quantity) / SUM(p.production_hours) AS efficiency
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.line_name
    ORDER BY efficiency ASC
    LIMIT 3
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [line_name, actual_quantity, production_hours]

- id: extra_006
  difficulty: extra
  category: implicit_metric
  query: "哪个工序的质量问题最严重?"
  # 隐含 = 不良率最高
  gold_sql: |
    SELECT pr.process_name,
           SUM(p.defect_quantity) / SUM(p.actual_quantity) AS defect_rate
    FROM table_production_record p
    JOIN table_process pr ON p.process_id = pr.process_id
    GROUP BY pr.process_name
    ORDER BY defect_rate DESC
    LIMIT 1
  gold_tables: [table_production_record, table_process]
  gold_columns: [process_name, defect_quantity, actual_quantity]

- id: extra_007
  difficulty: extra
  category: comparison_subquery
  query: "找出 Q1 比 Q2 实际产量更高的产线"
  gold_sql: |
    SELECT line_name FROM (
      SELECT w.line_name,
        SUM(CASE WHEN d.quarter = 'Q1' THEN p.actual_quantity ELSE 0 END) AS q1,
        SUM(CASE WHEN d.quarter = 'Q2' THEN p.actual_quantity ELSE 0 END) AS q2
      FROM table_production_record p
      JOIN table_workshop w ON p.workshop_id = w.workshop_id
      JOIN table_date d ON p.date_id = d.date_id
      GROUP BY w.line_name
    ) t WHERE q1 > q2
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [line_name, actual_quantity, quarter]

- id: extra_008
  difficulty: extra
  category: noisy_term
  query: "统计华东工厂的一车间各产线在 2026 年 Q1 的实际产量"
  # 多重过滤:工厂=华东 AND 车间=一车间 AND 时间=Q1
  gold_sql: |
    SELECT w.line_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE w.factory_name = '华东工厂' AND w.workshop_name = '一车间'
      AND d.year = 2026 AND d.quarter = 'Q1'
    GROUP BY w.line_name
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [line_name, actual_quantity, factory_name, workshop_name, year, quarter]
