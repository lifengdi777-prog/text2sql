# Hard: 3+ 表 JOIN、窗口函数、子查询、HAVING 比率筛选、多条件交叉
# 这一档考察:JOIN 路径规划 + 复杂 SQL 结构 + 业务术语→公式映射

- id: hard_001
  difficulty: hard
  category: three_table_time
  query: "统计 2026 年第一季度各工厂的实际产量"
  gold_sql: |
    SELECT w.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026 AND d.quarter = 'Q1'
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [factory_name, actual_quantity, year, quarter]

- id: hard_002
  difficulty: hard
  category: window_topn_per_group
  query: "每个工厂实际产量最高的产品分别是什么？"
  gold_sql: |
    SELECT factory_name, product_name, actual_quantity
    FROM (
      SELECT w.factory_name,
             pd.product_name,
             SUM(p.actual_quantity) AS actual_quantity,
             ROW_NUMBER() OVER (
               PARTITION BY w.factory_name
               ORDER BY SUM(p.actual_quantity) DESC
             ) AS rn
      FROM table_production_record p
      JOIN table_workshop w ON p.workshop_id = w.workshop_id
      JOIN table_product pd ON p.product_id = pd.product_id
      GROUP BY w.factory_name, pd.product_name
    ) t
    WHERE rn = 1
  gold_tables: [table_production_record, table_workshop, table_product]
  gold_columns: [factory_name, product_name, actual_quantity]

- id: hard_003
  difficulty: hard
  category: window_ratio_of_total
  query: "各产品类别的实际产量占总产量的比例是多少？"
  gold_sql: |
    SELECT pd.product_category,
           SUM(p.actual_quantity) / SUM(SUM(p.actual_quantity)) OVER () AS ratio
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_category
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_category, actual_quantity]

- id: hard_004
  difficulty: hard
  category: having_ratio
  query: "哪些车间的合格率低于 97%？"
  gold_sql: |
    SELECT w.workshop_name,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    GROUP BY w.workshop_name
    HAVING SUM(p.qualified_quantity) / SUM(p.actual_quantity) < 0.97
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [workshop_name, qualified_quantity, actual_quantity]

- id: hard_005
  difficulty: hard
  category: filter_dim_ratio_topn
  query: "在焊接工序中，合格率最高的车间是哪个？"
  gold_sql: |
    SELECT w.workshop_name,
           SUM(p.qualified_quantity) / SUM(p.actual_quantity) AS qualified_rate
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_process pr ON p.process_id = pr.process_id
    WHERE pr.process_name = '焊接'
    GROUP BY w.workshop_name
    ORDER BY qualified_rate DESC
    LIMIT 1
  gold_tables: [table_production_record, table_workshop, table_process]
  gold_columns: [workshop_name, qualified_quantity, actual_quantity, process_name]

- id: hard_006
  difficulty: hard
  category: filter_equipment_status
  query: "各工厂中处于运行状态的设备的实际产量是多少？"
  gold_sql: |
    SELECT w.factory_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_equipment e ON p.equipment_id = e.equipment_id
    WHERE e.equipment_status = '运行'
    GROUP BY w.factory_name
  gold_tables: [table_production_record, table_workshop, table_equipment]
  gold_columns: [factory_name, actual_quantity, equipment_status]

- id: hard_007
  difficulty: hard
  category: subquery_above_avg
  query: "哪些产品的实际产量高于所有产品的平均实际产量？"
  gold_sql: |
    SELECT pd.product_name, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_product pd ON p.product_id = pd.product_id
    GROUP BY pd.product_name
    HAVING SUM(p.actual_quantity) > (
      SELECT AVG(s) FROM (
        SELECT SUM(actual_quantity) AS s
        FROM table_production_record
        GROUP BY product_id
      ) x
    )
  gold_tables: [table_production_record, table_product]
  gold_columns: [product_name, actual_quantity]

- id: hard_008
  difficulty: hard
  category: time_quarter_trend
  query: "2026 年各季度的实际产量分别是多少？"
  gold_sql: |
    SELECT d.quarter, SUM(p.actual_quantity) AS actual_quantity
    FROM table_production_record p
    JOIN table_date d ON p.date_id = d.date_id
    WHERE d.year = 2026
    GROUP BY d.quarter
    ORDER BY d.quarter
  gold_tables: [table_production_record, table_date]
  gold_columns: [quarter, actual_quantity, year]

- id: hard_009
  difficulty: hard
  category: window_rank
  query: "按产量达成率给各工厂排名，并给出名次序号"
  gold_sql: |
    SELECT factory_name,
           achievement_rate,
           RANK() OVER (ORDER BY achievement_rate DESC) AS rk
    FROM (
      SELECT w.factory_name,
             SUM(p.actual_quantity) / SUM(p.planned_quantity) AS achievement_rate
      FROM table_production_record p
      JOIN table_workshop w ON p.workshop_id = w.workshop_id
      GROUP BY w.factory_name
    ) t
  gold_tables: [table_production_record, table_workshop]
  gold_columns: [factory_name, actual_quantity, planned_quantity]

- id: hard_010
  difficulty: hard
  category: efficiency_metric_filter
  query: "2026 年华东工厂各产线的生产效率是多少？"
  gold_sql: |
    SELECT w.line_name,
           SUM(p.actual_quantity) / SUM(p.production_hours) AS efficiency
    FROM table_production_record p
    JOIN table_workshop w ON p.workshop_id = w.workshop_id
    JOIN table_date d ON p.date_id = d.date_id
    WHERE w.factory_name = '华东工厂' AND d.year = 2026
    GROUP BY w.line_name
  gold_tables: [table_production_record, table_workshop, table_date]
  gold_columns: [line_name, actual_quantity, production_hours, factory_name, year]
